<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TourFlow</title>
<meta name="description" content="Program, gruppechat og veibeskrivelse for klasseturen.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14508C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TourFlow">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css?v=60">
</head>
<body>

<!-- ============ OPPSTART ============ -->
<section id="bootScreen" class="join">
  <div class="join-inner" style="text-align:center">
    <div class="mark" style="margin:0 auto 18px" aria-hidden="true">
      <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21"/><path d="M31 17 20.5 21 17 31.5 27.5 27.5 31 17Z"/></svg>
    </div>
    <p class="muted" id="bootMsg">Kobler til…</p>
  </div>
</section>

<!-- ============ JOIN ============ -->
<section id="joinScreen" class="join" hidden>
  <div class="join-inner">
    <button class="tilbake" id="joinTilbake" hidden>&#8249; Tilbake</button>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21"/><path d="M31 17 20.5 21 17 31.5 27.5 27.5 31 17Z"/></svg>
    </div>
    <h1>Bli med på turen</h1>
    <p class="lede">Skriv navnet ditt og turkoden du fikk av reiselederen.</p>
    <p id="joinKonto" class="kontolinje" hidden></p>

    <form id="joinForm" novalidate>
      <div class="field">
        <label for="fFirst">Fornavn</label>
        <input id="fFirst" name="first" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="fLast">Etternavn</label>
        <input id="fLast" name="last" autocomplete="family-name" required>
      </div>
      <div class="field">
        <label for="fCode">Turkode</label>
        <input id="fCode" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="SEKS TEGN" required>
      </div>
      <p class="err" id="joinErr" role="alert" hidden></p>
      <button class="btn primary big" type="submit" id="joinSubmit">Bli med på turen</button>
    </form>


    <p style="text-align:center;margin-top:20px;font-size:14.5px;color:var(--ink-2)">
      Er du reiseleder? <button type="button" class="linkbtn" data-sheet="newtrip">Lag en ny tur</button>
    </p>
  </div>
</section>

<!-- ============ APP ============ -->

<!-- ============ INNLOGGING ============ -->
<section id="authScreen" class="join" hidden>
  <div class="join-inner" id="authInner"></div>
</section>
<section id="appScreen" class="app" hidden>
  <header class="apphead" id="apphead">
    <button class="tripbtn" id="tripBtn" aria-haspopup="dialog">
      <span class="tripname" id="tripName">—</span>
      <span class="tripsub" id="tripSub">—</span>
    </button>
    <button class="avatar" id="meBtn" aria-label="Din profil"><span id="avatarText">–</span></button>
  </header>

  <header class="convhead" id="convhead" hidden>
    <button class="back" id="backBtn" aria-label="Tilbake til chattene">
      <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <div class="t"><b id="convName">—</b><small id="convSub">—</small></div>
    <button class="who" id="convWho" data-members="">Deltakere</button>
  </header>

  <div id="banner"></div>
  <main class="screen" id="screen" tabindex="-1"></main>
  <div id="composerSlot"></div>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="Hovedmeny"></nav>
</section>

<!-- ============ ARK ============ -->
<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/config.js?v=60"></script>
<script src="vendor/supabase.js?v=60"></script>
<script src="js/templates.js?v=60"></script>
<script src="js/api.js?v=60"></script>
<script src="js/parse.js?v=60"></script>
<script src="js/ui.js?v=60"></script>
<script>

// Safari regner 100dvh litt feil, og da blir appen kortere enn skjermen —
// det er den hvite stripa under fanelinja. Vi måler i stedet det
// nettleseren faktisk viser, og setter høyden selv.
(function appHoyde() {
  const sett = () => {
    const vv = window.visualViewport;
    const h = vv ? vv.height + vv.offsetTop : window.innerHeight;
    document.documentElement.style.setProperty("--app-h", Math.round(h) + "px");
  };
  sett();
  addEventListener("resize", sett);
  addEventListener("orientationchange", () => setTimeout(sett, 200));
  addEventListener("pageshow", sett);
  if (window.visualViewport) {
    visualViewport.addEventListener("resize", sett);
    visualViewport.addEventListener("scroll", sett);
  }
})();

// Knip-zoom av: iOS respekterer ikke user-scalable aleine.
["gesturestart", "gesturechange", "gestureend"].forEach(n =>
  document.addEventListener(n, e => e.preventDefault(), { passive: false })
);
if ("serviceWorker" in navigator) {
  // Laster siden seg selv på nytt én gang når en ny versjon har tatt over,
  // slik at man aldri sitter igjen med gammel CSS eller gammel kode.
  let laster = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (laster) return;
    laster = true;
    location.reload();
  });

  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      // Et mislykket sjekk etter ny versjon er ikke verdt en feil i
      // konsollen — appen kjører videre på den versjonen den har.
      const sjekk = () => reg.update().catch(() => {});
      sjekk();
      // Se etter ny versjon hver gang appen hentes fram igjen.
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") sjekk();
      });
    }).catch(() => {});
  });
}
</script>
</body>
</html>
